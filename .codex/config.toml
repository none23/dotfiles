personality = "pragmatic"
model = "gpt-5.5"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
service_tier = "fast"
approval_policy = "never"
suppress_unstable_features_warning = true
# sandbox_mode = "workspace-write"
sandbox_mode = "danger-full-access"
# approval_policy = "on-request"


[features]
default_mode_request_user_input = true
hooks = true
multi_agent = true
js_repl = true
apps = false
image_detail_original = true
external_migration = true
# memories = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "weekly-limit", "five-hour-limit", "context-remaining", "total-output-tokens"]

[tui.keymap.editor]
insert_newline = ["ctrl-enter", "ctrl-j", "shift-enter"]

[tui.model_availability_nux]
"gpt-5.3-codex-spark" = 4
"gpt-5.5" = 4

[notice]
hide_full_access_warning = true

[plugins."github@openai-curated"]
enabled = false


